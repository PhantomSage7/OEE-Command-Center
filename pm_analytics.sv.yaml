verified_queries:
  - name: 0;1
    question: What is the OEE performance for each plant along with their asset counts
      and risk status?
    sql: SELECT PLANT_NAME, ROUND(AVG_OEE_30D * 100, 1) AS OEE_PCT, TOTAL_ASSETS,
      ASSETS_CRITICAL_RISK, ACTIVE_ALERTS FROM dt_plant_dashboard ORDER BY AVG_OEE_30D
      DESC
    verified_at: 1790573771
    verified_by: Semantic Model Generator
  - name: 1;1
    question: Which assets are in the worst condition?
    sql: SELECT ASSET_ID, ASSET_NAME, PLANT_NAME, ROUND(BEARING_HEALTH_SCORE, 0) AS
      HEALTH, ADR_RISK, ROUND(PEAK_VEL_RMS, 1) AS PEAK_VEL_MM_S, WORST_ISO_ZONE FROM
      dt_bearing_health ORDER BY BEARING_HEALTH_SCORE ASC LIMIT 10
    verified_at: 1790573771
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What are the current actionable vibration alerts that require immediate
      attention?
    sql: SELECT ALERT_SEVERITY, ASSET_NAME, PLANT_NAME, ROUND(BEARING_HEALTH_SCORE,
      0) AS HEALTH, RECOMMENDED_ACTION FROM dt_vibration_alerts WHERE IS_ACTIONABLE
      = TRUE ORDER BY CASE ALERT_SEVERITY WHEN 'CRITICAL' THEN 1 WHEN 'HIGH' THEN
      2 ELSE 3 END
    verified_at: 1790573771
    verified_by: Semantic Model Generator
  - name: 3;1
    question: What are the most common failure modes across plants and how do they
      compare by total maintenance tickets?
    sql: SELECT PLANT_NAME, SUM(TOTAL_TICKETS) AS TICKETS, SUM(BEARING_DEFECT_COUNT)
      AS BEARING, SUM(MISALIGNMENT_COUNT) AS MISALIGN, SUM(UNBALANCE_COUNT) AS UNBALANCE,
      ROUND(AVG(AVG_MTTR_HOURS), 1) AS AVG_MTTR FROM dt_ticket_analytics GROUP BY
      PLANT_NAME ORDER BY TICKETS DESC
    verified_at: 1790573771
    verified_by: Semantic Model Generator
  - name: 4;1
    question: What is the daily OEE trend by plant over the last 30 days?
    sql: SELECT TO_CHAR(RUN_DATE, 'YYYY-MM-DD') AS DT, PLANT_NAME, ROUND(AVG(OEE)
      * 100, 1) AS OEE_PCT FROM dt_oee_metrics WHERE RUN_DATE >= DATEADD(DAY, -30,
      CURRENT_DATE) GROUP BY DT, PLANT_NAME ORDER BY DT
    verified_at: 1790573771
    verified_by: Semantic Model Generator
  - name: 5;1
    question: What is the distribution of assets across different risk categories
      and their corresponding health metrics?
    sql: SELECT ADR_RISK, COUNT(*) AS ASSET_COUNT, ROUND(AVG(BEARING_HEALTH_SCORE),
      0) AS AVG_HEALTH, ROUND(AVG(PEAK_VEL_RMS), 1) AS AVG_VEL FROM dt_bearing_health
      GROUP BY ADR_RISK ORDER BY AVG_HEALTH
    verified_at: 1790573771
    verified_by: Semantic Model Generator
